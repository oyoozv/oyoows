
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <title>oz.tea</title>
  <meta name="description" content="oyoo 的个人导航站" />
  <link rel="shortcut icon" href="https://github.githubassets.com/favicons/favicon.svg" type="image/svg+xml">
  <style>
    :root{
      --bg:#ffffff;--card:#f7f7f8;--text:#0b0b0b;--muted:#6b6b6b;
      --shadow:0 8px 24px rgba(15,15,15,0.06);--rounded:34px;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;padding:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:var(--text)}
    .container{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:36px 20px}
    .page{width:680px;max-width:95%;text-align:center;padding-bottom:48px}
    .avatar{width:96px;height:96px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,0.06)}
    .title{margin:16px 0 6px;font-size:22px;font-weight:700}
    .subtitle{margin:0 0 20px;font-size:14px;color:var(--muted)}
    .links{margin-top:24px;display:flex;flex-direction:column;gap:16px}
    .link-wrap{position:relative;height:68px;touch-action:manipulation}
    .link-bg{position:absolute;inset:0;border-radius:var(--rounded);background:linear-gradient(180deg,#fff,#fbfbfb);box-shadow:var(--shadow);z-index:0;pointer-events:none;transition:transform .25s,box-shadow .25s}
    .link{position:relative;z-index:10;display:flex;align-items:center;height:68px;text-decoration:none;color:var(--text);padding:0 20px 0 72px;border-radius:var(--rounded);transition:transform .18s}
    .link:active{transform:translateY(1px) scale(.998)}
    .link-icon{position:absolute;left:14px;width:44px;height:44px;border-radius:8px;object-fit:cover;z-index:11;box-shadow:0 6px 14px rgba(10,10,10,0.04);background:#fff}
    .link-title{font-size:16px;font-weight:500;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .link-sub{display:block;font-size:12px;color:var(--muted);margin-top:4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .link-wrap:hover .link-bg{transform:translateY(-6px);box-shadow:0 18px 40px rgba(15,15,15,0.08)}
    .link-wrap:hover .link{transform:translateY(-6px)}
    @media(max-width:480px){.page{padding-bottom:24px}.link{padding-left:64px;padding-right:14px}.link-title{font-size:15px}.link-wrap{height:64px}.link-bg{border-radius:26px}}
  </style>
</head>
<body>
  <div class="container">
    <main class="page" id="app">
      <img class="avatar" src="img/photo.jpg" alt="oyoo 头像">
      <h1 class="title">oz.tea</h1>
      <p class="subtitle">oyoo的个人导航站</p>

      <section class="links" id="linksContainer" aria-label="链接列表"></section>
    </main>
  </div>

  <script>
    /* ===== 配置 =====
     * DUPLICATE_EACH = false -> 不再复制每条（只显示 baseLinks 原始条目）
     */
    const DUPLICATE_EACH = false;

    /* baseLinks：3 个链接（如需修改只改这里） */
 const baseLinks = [
  { title: "oyoo的个人博客", url: "https://oyoo.us/", hint: "个人博客", icon: "img/blog.png" },
  { title: "MoonTV影视站", url: "https://2045.eu.org/", hint: "MoonTV 影视站", icon: "img/tv.png" },
  { title: "自用图床", url: "https://img.2045.eu.org/", hint: "图床地址", icon: "img/jpg.png" },
  { title: "域名邮箱入口", url: "https://mail.serv00.com/", hint: "邮箱入口", icon: "img/email.png" }
];


    (function initLinks(){
      // 1) 防止脚本被多次加载重复渲染（若页面内有多个 script 标签再次运行）
      if (window.__linksRendered) {
        console.warn('Links script: 已检测到先前渲染，跳过重复渲染');
        return;
      }
      window.__linksRendered = true;

      // 2) 生成最终数组
      const links = [];
      baseLinks.forEach(item => {
        links.push({...item});
        if (DUPLICATE_EACH) links.push({...item});
      });

      // 3) 获取容器并清空（保证无残留）
      const container = document.getElementById('linksContainer');
      if (!container) {
        console.error('Links script: 找不到 #linksContainer');
        return;
      }
      container.innerHTML = '';

      // 4) 校验：避免无意中产生数量不对
      console.log(`Links script: baseLinks=${baseLinks.length}, DUPLICATE_EACH=${DUPLICATE_EACH}, final_count=${links.length}`);

      // 5) 渲染
      links.forEach((item, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'link-wrap';

        const bg = document.createElement('div');
        bg.className = 'link-bg';
        wrap.appendChild(bg);

        const a = document.createElement('a');
        a.className = 'link';
        a.href = item.url;
        a.target = '_blank';
        a.rel = 'noopener nofollow noreferrer';
        a.setAttribute('aria-label', item.title + '（新窗口打开）');

        const img = document.createElement('img');
        img.className = 'link-icon';
        img.src = item.icon;
        img.alt = item.title + ' 图标';
        a.appendChild(img);

        const text = document.createElement('div');
        text.style.display = 'flex';
        text.style.flexDirection = 'column';
        text.style.alignItems = 'flex-start';
        text.style.justifyContent = 'center';
        text.style.width = '100%';

        const title = document.createElement('span');
        title.className = 'link-title';
        title.textContent = item.title;
        text.appendChild(title);

        if (item.hint) {
          const sub = document.createElement('span');
          sub.className = 'link-sub';
          sub.textContent = item.hint;
          text.appendChild(sub);
        }

        a.appendChild(text);
        wrap.appendChild(a);

        // entrance animation
        wrap.style.opacity = '0';
        wrap.style.transform = 'translateY(8px)';
        container.appendChild(wrap);
        requestAnimationFrame(() => {
          setTimeout(() => {
            wrap.style.transition = 'opacity .36s ease, transform .36s cubic-bezier(.2,.9,.3,1)';
            wrap.style.opacity = '1';
            wrap.style.transform = 'translateY(0)';
          }, idx * 70);
        });
      });

      // 6) 最后再校验一次 DOM 中的子元素数量是否与 links 数组一致
      const renderedCount = container.children.length;
      if (renderedCount !== links.length) {
        console.warn(`Links script: 渲染数量不一致：expected=${links.length}, rendered=${renderedCount}`);
      } else {
        console.log('Links script: 渲染完成，数量一致。');
      }
    })();
  </script>
</body>
</html>
